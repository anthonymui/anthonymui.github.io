```html
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #101820;
    --bg2: #17232d;
    --bg3: #1d2b36;

    --accent: #d9895b;
    --accent-light: #e7a77e;

    --text: #eee9df;
    --muted: #a8aaa5;

    --border: rgba(238, 233, 223, 0.12);

    --serif: "Libre Baskerville", Georgia, serif;
    --sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --display: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 4rem;
    background: rgba(16, 24, 32, 0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: var(--serif);
    font-size: 1.55rem;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
  }

  .nav-back {
    color: var(--muted);
    text-decoration: none;
    font-family: var(--sans);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: color 0.2s ease;
  }

  .nav-back:hover {
    color: var(--accent-light);
  }

  .case-hero {
    padding: 10rem 4rem 2rem;
    max-width: 860px;
    margin: 0 auto;
  }

  .case-label {
    font-family: var(--display);
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent-light);
    margin-bottom: 1rem;
  }

  .case-title {
    font-family: var(--serif);
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    line-height: 1.1;
    font-weight: 400;
    letter-spacing: -0.025em;
    margin-bottom: 1.5rem;
  }

  .case-subtitle {
    color: var(--muted);
    font-size: 1.15rem;
    line-height: 1.8;
    max-width: 600px;
    margin-bottom: 1.5rem;
  }

  .hero-btns {
    display: flex;
    gap: 0.8rem;
    margin-bottom: 3rem;
    flex-wrap: wrap;
  }

  .btn-primary,
  .btn-ghost {
    padding: 0.8rem 1.7rem;
    border-radius: 3px;
    font-family: var(--sans);
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    text-decoration: none;
    transition: all 0.2s ease;
    display: inline-block;
  }

  .btn-primary {
    background: var(--accent);
    color: #17130f;
    font-weight: 600;
    border: 1px solid var(--accent);
  }

  .btn-primary:hover {
    background: var(--accent-light);
    border-color: var(--accent-light);
    transform: translateY(-2px);
  }

  .btn-ghost {
    color: var(--text);
    font-weight: 500;
    border: 1px solid var(--border);
  }

  .btn-ghost:hover {
    border-color: var(--accent);
    color: var(--accent-light);
  }

  .meta-row {
    display: flex;
    gap: 3rem;
    padding: 2rem 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 2.5rem;
    flex-wrap: wrap;
  }

  .meta-key {
    font-family: var(--display);
    font-size: 0.63rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }

  .meta-val {
    font-size: 0.95rem;
    color: var(--text);
    font-weight: 500;
  }

  .case-body {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 4rem 6rem;
  }

  .case-section {
    margin-bottom: 4rem;
  }

  .case-section-title {
    font-family: var(--serif);
    font-size: 1.6rem;
    line-height: 1.2;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 1.5rem;
  }

  .case-body p {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.85;
    margin-bottom: 1.2rem;
  }

  .case-body p strong {
    color: var(--text);
    font-weight: 600;
  }

  .callout {
    background: var(--bg2);
    border-left: 3px solid var(--accent);
    padding: 1.5rem 2rem;
    border-radius: 0 4px 4px 0;
    margin: 2rem 0;
  }

  .callout p {
    color: var(--text);
    font-size: 1.05rem;
    font-style: italic;
    margin: 0;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    margin: 2rem 0;
  }

  .metric {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 1.5rem;
    border-radius: 4px;
  }

  .metric-num {
    font-family: var(--display);
    font-size: 2.2rem;
    color: var(--accent-light);
    line-height: 1;
    margin-bottom: 0.4rem;
  }

  .metric-label {
    font-size: 0.8rem;
    color: var(--muted);
  }

  .decision-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    margin: 1.5rem 0;
  }

  .decision-list li {
    padding-left: 1.5rem;
    position: relative;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.75;
  }

  .decision-list li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--accent);
  }

  .decision-list li strong {
    color: var(--text);
  }

  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--accent-light);
    text-decoration: none;
    font-family: var(--sans);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-top: 3rem;
    transition: gap 0.2s;
  }

  .btn-back:hover {
    gap: 0.8rem;
    color: var(--accent);
  }

  footer {
    background: #0c141b;
    border-top: 1px solid var(--border);
    padding: 2rem 4rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-name {
    font-family: var(--serif);
    font-size: 1rem;
    color: var(--muted);
  }

  .footer-note {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  @media (max-width: 768px) {
    nav {
      padding: 1rem 1.5rem;
    }

    .nav-logo {
      font-size: 1.4rem;
    }

    .case-hero,
    .case-body {
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    .metrics-grid {
      grid-template-columns: 1fr 1fr;
    }

    .meta-row {
      gap: 1.5rem;
    }

    footer {
      padding: 1.5rem;
    }
  }

  @media (max-width: 480px) {
    .metrics-grid {
      grid-template-columns: 1fr;
    }

    .case-title {
      font-size: 3.1rem;
    }
  }
</style>
```

Also change the single hero button from:

```html
<a href="index.html#work" class="btn-primary">← Back to Work</a>
```

to:

```html
<a href="index.html#work" class="btn-ghost">← Back to Work</a>
```
